name: Gradle Package

on:
  push:
    branches: [ 2.0 ]
  pull_request:
    branches: [ 2.0 ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build

      - name: Upload build artifacts api
        uses: actions/upload-artifact@v7
        with:
          name: api-build
          path: build/libs/packetevents-api-*.jar

      - name: Upload build artifacts spigot
        uses: actions/upload-artifact@v7
        with:
          name: spigot-build
          path: build/libs/packetevents-spigot-*.jar

      - name: Upload build artifacts netty-common
        uses: actions/upload-artifact@v7
        with:
          name: netty-common-build
          path: build/libs/packetevents-netty-common-*.jar

      - name: Upload build artifacts bungeecord
        uses: actions/upload-artifact@v7
        with:
          name: bungeecord-build
          path: build/libs/packetevents-bungeecord-*.jar

      - name: Upload build artifacts velocity
        uses: actions/upload-artifact@v7
        with:
          name: velocity-build
          path: build/libs/packetevents-velocity-*.jar

      - name: Upload build artifacts fabric
        uses: actions/upload-artifact@v7
        with:
          name: fabric-build
          path: build/libs/packetevents-fabric-*.jar

      - name: Upload build artifacts sponge
        uses: actions/upload-artifact@v7
        with:
          name: sponge-build
          path: build/libs/packetevents-sponge-*.jar

      - name: Upload build artifacts neoforge
        uses: actions/upload-artifact@v7
        with:
          name: neoforge-build
          path: build/libs/packetevents-neoforge-*.jar

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/api-build/*.jar
            artifacts/spigot-build/*.jar
            artifacts/netty-common-build/*.jar
            artifacts/bungeecord-build/*.jar
            artifacts/velocity-build/*.jar
            artifacts/fabric-build/*.jar
            artifacts/sponge-build/*.jar
            artifacts/neoforge-build/*.jar

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Publish to Maven Central
        run: chmod +x gradlew && ./gradlew publishToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}